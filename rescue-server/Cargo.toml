[package]
name = "rescue-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rescue terminal protocol server crate: embeddable PTY-over-WebSocket for edge devices"


[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
async-trait = "0.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio-tungstenite = "0.24"
